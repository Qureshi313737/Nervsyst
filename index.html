<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Neuromap Atlas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Interactive 3D atlas of the human nervous system with filters and clickable nerves.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/style.css">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="stage" aria-label="3D view of the human nervous system"></div>

<header class="brand">
  <button id="btn-panel" class="icon-btn" type="button" aria-label="Show filters and structure list">
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/></svg>
  </button>
  <div class="mark" aria-hidden="true">
    <svg viewBox="0 0 40 40" width="30" height="30"><path d="M20 3v34M20 11c-6 0-9 3-12 7M20 11c6 0 9 3 12 7M20 20c-5 1-8 4-10 9M20 20c5 1 8 4 10 9M20 29c-3 1-5 3-6 7M20 29c3 1 5 3 6 7" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/><circle cx="20" cy="4" r="2.6" fill="currentColor"/></svg>
  </div>
  <div class="brand-text">
    <h1>Neuromap</h1>
    <p>Systema nervosum · 3D atlas</p>
  </div>
</header>

<aside id="panel" aria-label="Filters and structures">
  <div id="filters"></div>
  <p id="filter-note" class="filter-note"></p>
  <section class="listwrap">
    <div class="list-top">
      <h3 class="eyebrow">Structures</h3>
      <span id="list-count" class="count"></span>
    </div>
    <label class="search">
      <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="M16 16l4.5 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <input id="search" type="search" placeholder="Search: median, vagus, L5…" autocomplete="off" aria-label="Search structures">
    </label>
    <ul id="list"></ul>
  </section>
</aside>

<aside id="info" hidden aria-labelledby="info-title">
  <div class="info-actions">
    <button id="btn-focus" class="ghost-btn" type="button">Focus</button>
    <button id="btn-isolate" class="ghost-btn" type="button">Isolate</button>
    <button id="btn-close" class="icon-btn" type="button" aria-label="Close details">
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>
  </div>
  <div id="info-body"></div>
</aside>

<nav id="toolbar" aria-label="View controls">
  <div class="tgroup" role="group" aria-label="Camera views">
    <button type="button" class="tbtn" data-view="body">Body</button>
    <button type="button" class="tbtn" data-view="head">Head</button>
    <button type="button" class="tbtn" data-view="spine">Spine</button>
    <button type="button" class="tbtn" data-view="arm">Arm</button>
    <button type="button" class="tbtn" data-view="leg">Leg</button>
  </div>
  <div class="tgroup" role="group" aria-label="Layers">
    <button type="button" class="tbtn tog" id="t-skin" aria-pressed="true">Skin</button>
    <button type="button" class="tbtn tog" id="t-skeleton" aria-pressed="true">Skeleton</button>
    <button type="button" class="tbtn tog" id="t-organs" aria-pressed="true">Organs</button>
    <button type="button" class="tbtn tog" id="t-labels" aria-pressed="true">Labels</button>
    <button type="button" class="tbtn tog" id="t-signals" aria-pressed="true">Signals</button>
    <button type="button" class="tbtn tog" id="t-rotate" aria-pressed="true">Rotate</button>
    <button type="button" class="tbtn tog" id="t-isolate" aria-pressed="false" title="Hide nerves outside the active filter instead of ghosting them">Hide others</button>
  </div>
  <label class="tgroup select">
    <span>Colour</span>
    <select id="color-mode" aria-label="Colour nerves by">
      <option value="systems">Systems</option>
      <option value="function">Function</option>
      <option value="atlas">Classic atlas</option>
    </select>
  </label>
</nav>

<div id="legend" aria-live="polite"></div>
<div id="tooltip" hidden></div>

<div id="intro">
  <div class="bar top"></div>
  <div class="bar bottom"></div>
  <div class="intro-copy">
    <p class="eyebrow">Interactive anatomy</p>
    <h2>Systema nervosum</h2>
    <p class="intro-sub">12 cranial pairs · 31 spinal pairs · <span id="stat-count">—</span> modelled nerve structures</p>
    <p class="intro-hint">Click any nerve to study it. Drag to orbit, scroll to zoom.</p>
  </div>
</div>

<noscript><p class="noscript">This atlas needs JavaScript and WebGL.</p></noscript>
<script type="module" src="js/main.js"></script>
</body>
</html>
