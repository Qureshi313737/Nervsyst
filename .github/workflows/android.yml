name: Build Android APK

on:
  push:
    branches: [main, ccr-dc8cd523-myeiqp]
    paths:
      - index.html
      - css/**
      - js/**
      - android/**
      - scripts/**
      - package.json
      - package-lock.json
      - .github/workflows/android.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Bundle the site for offline use
        run: |
          npm ci
          npm run build:www

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Use private Play upload key when configured
        env:
          KS_B64: ${{ secrets.NEUROMAP_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "NEUROMAP_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "Signing with the private upload key from repository secrets."
          else
            echo "No private key secret: signing with the public sideload key."
          fi

      - name: Build signed APK and App Bundle
        working-directory: android
        env:
          NEUROMAP_KEYSTORE_PASSWORD: ${{ secrets.NEUROMAP_KEYSTORE_PASSWORD }}
          NEUROMAP_KEY_ALIAS: ${{ secrets.NEUROMAP_KEY_ALIAS }}
          NEUROMAP_KEY_PASSWORD: ${{ secrets.NEUROMAP_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          # retry: the Gradle distribution download occasionally fails with a 5xx
          for attempt in 1 2 3; do
            ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace && exit 0
            echo "Build attempt $attempt failed; retrying in $((attempt * 20))s"
            sleep $((attempt * 20))
          done
          exit 1

      - name: Collect outputs
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk Neuromap.apk
          cp android/app/build/outputs/bundle/release/app-release.aab Neuromap.aab

      - uses: actions/upload-artifact@v4
        with:
          name: Neuromap-android
          path: |
            Neuromap.apk
            Neuromap.aab

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v1.0.${{ github.run_number }}
          name: Neuromap Android v1.0.${{ github.run_number }}
          make_latest: true
          files: |
            Neuromap.apk
            Neuromap.aab
          body: |
            Offline Android app of the Neuromap 3D nervous system atlas.

            **Install on a phone:** download `Neuromap.apk`, open it, and allow "Install unknown apps" for your browser or file manager when Android asks. Requires Android 8.0 or newer.

            **Google Play:** `Neuromap.aab` is the Android App Bundle for upload to the Play Console. It is signed with the repository's public sideload key; for a store listing, enrol in Play App Signing or rebuild with your own private upload key.
